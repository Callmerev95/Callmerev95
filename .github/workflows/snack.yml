name: generate-snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=0f0f0f&color_dots=#ebedf0,#c6cdd5,#959da5,#586069,#24292e
            dist/github-snake-dark.svg?color_snake=f2f2f2&color_dots=#161b22,#21262d,#30363d,#484f58,#8b949e
      - name: Commit snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet || git commit -m "chore: update contribution snake"
          git push
